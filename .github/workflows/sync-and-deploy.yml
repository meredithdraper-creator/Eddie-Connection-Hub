name: Sync sheet & deploy Eddie

on:
  schedule:
    - cron: "15 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Sync from Google Sheet
        run: node scripts/sync.mjs
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}
          OPPORTUNITIES_GID: ${{ vars.OPPORTUNITIES_GID }}
          EVENTS_GID: ${{ vars.EVENTS_GID }}

      - name: Import events from the calendar feed
        run: node scripts/fetch-events.mjs
        env:
          EVENTS_FEED_URL: ${{ secrets.EVENTS_FEED_URL }}

      - name: Commit updated data
        if: github.event_name != 'push'
        run: |
          git add data
          if ! git diff --cached --quiet; then
            git config user.name "eddie-sync[bot]"
            git config user.email "eddie-sync@users.noreply.github.com"
            git commit -m "chore: sync Connection Hub data"
            git push
          fi

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html css js assets data _site/
          rm -f _site/data/*.csv

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
